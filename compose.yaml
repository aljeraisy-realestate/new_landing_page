services:
  giftly:
    build:
      context: .
      args:
        VITE_APP_STORE_URL: ${VITE_APP_STORE_URL:-}
        VITE_PLAY_STORE_URL: ${VITE_PLAY_STORE_URL:-}
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      HOST: 0.0.0.0
      NODE_ENV: production
      APP_ORIGIN: ${APP_ORIGIN:-http://localhost:3000}
      SQLITE_DATA_DIR: /data
      SQLITE_REQUIRE_EXISTING: "true"
    volumes:
      - giftly-data:/data
    init: true
    restart: unless-stopped
    stop_grace_period: 10s

volumes:
  giftly-data:
    name: giftly-data
    external: true
